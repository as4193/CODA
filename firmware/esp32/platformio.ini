; CODA firmware for ESP32-S3 (ESP-IDF + espressif/esp-tflite-micro, which uses ESP-NN kernels).
; Build:  ../.pio-venv/bin/pio run            Flash: ../.pio-venv/bin/pio run -t upload
; Use the USB port labelled "UART" on the DevKitC-1 (USB-to-UART bridge on UART0).
[platformio]
default_envs = esp32s3
; ESP-IDF refuses build paths with spaces (this repo lives under ".../Term 1/..."), so build outside it
build_dir = ${sysenv.HOME}/Library/Caches/coda-firmware/esp32

[env:esp32s3]
platform = platformio/espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 921600
upload_speed = 921600
