; CODA firmware for STM32 Nucleo boards (Arduino core STM32duino + TFLM + CMSIS-NN).
; Build:  ../.pio-venv/bin/pio run            Flash: ../.pio-venv/bin/pio run -e nucleo_f446re -t upload
[platformio]
default_envs = nucleo_f446re, nucleo_h743zi

[tflm]
dir = ../lib/tflm
flags =
  -std=gnu++17
  -O2
  -ffp-contract=off
  -DTF_LITE_STATIC_MEMORY
  -DTF_LITE_DISABLE_X86_NEON
  -DTF_LITE_STRIP_ERROR_STRINGS
  -DNDEBUG
  -DCMSIS_NN
  -DCODA_TFLM_TIME
  -I${tflm.dir}
  -I${tflm.dir}/third_party/flatbuffers/include
  -I${tflm.dir}/third_party/gemmlowp
  -I${tflm.dir}/third_party/ruy
  -I${tflm.dir}/third_party/cmsis_nn
  -I${tflm.dir}/third_party/cmsis_nn/Include

[env]
platform = platformio/ststm32@20.0.0
framework = arduino
lib_deps =
  symlink://../common
  symlink://../lib/tflm
lib_ldf_mode = off
build_unflags = -Os -std=gnu++14 -std=gnu++11
build_flags =
  ${tflm.flags}
  -DSERIAL_RX_BUFFER_SIZE=1024
  -DSERIAL_TX_BUFFER_SIZE=256
  -DCODA_BAUD=921600
monitor_speed = 921600
upload_protocol = stlink

; NUCLEO-F446RE: Cortex-M4F, 180 MHz, 512 KB flash, 128 KB SRAM
[env:nucleo_f446re]
board = nucleo_f446re
build_flags =
  ${env.build_flags}
  -DCODA_BOARD_NAME=\"nucleo-f446re\"
  -DCODA_ARENA_BYTES=24576
  -DCODA_MODEL_CAPACITY=49152

; NUCLEO-H743ZI / H743ZI2: Cortex-M7, 480 MHz, 2 MB flash, 1 MB SRAM
[env:nucleo_h743zi]
board = nucleo_h743zi
build_flags =
  ${env.build_flags}
  -DCODA_BOARD_NAME=\"nucleo-h743zi\"
  -DCODA_DWT_UNLOCK=1
  -DCODA_ARENA_BYTES=65536
  -DCODA_MODEL_CAPACITY=131072
