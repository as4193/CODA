; CODA firmware for Raspberry Pi Pico 2 (RP2350, Cortex-M33) - Arduino-Pico core + TFLM + CMSIS-NN.
; Build:  ../.pio-venv/bin/pio run            Flash: ../.pio-venv/bin/pio run -t upload (or drag .uf2)
[platformio]
default_envs = pico2

[tflm]
dir = ../lib/tflm
flags =
  -std=gnu++17
  -O2
  -ffp-contract=off
  -DTF_LITE_STATIC_MEMORY
  -DTF_LITE_DISABLE_X86_NEON
  -DTF_LITE_STRIP_ERROR_STRINGS
  -DNDEBUG
  -DCMSIS_NN
  -DCODA_TFLM_TIME
  -I${tflm.dir}
  -I${tflm.dir}/third_party/flatbuffers/include
  -I${tflm.dir}/third_party/gemmlowp
  -I${tflm.dir}/third_party/ruy
  -I${tflm.dir}/third_party/cmsis_nn
  -I${tflm.dir}/third_party/cmsis_nn/Include

; RP2350: Cortex-M33 at 150 MHz, 520 KB SRAM, 4 MB flash on the Pico 2
[env:pico2]
; maxgerhardt fork (official platformio/raspberrypi has no Arduino-Pico / RP2350), pinned commit
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a05e3b212660ac6fdd3fbfb328d1988aa1
board = rpipico2
framework = arduino
board_build.core = earlephilhower
lib_deps =
  symlink://../common
  symlink://../lib/tflm
lib_ldf_mode = off
build_unflags = -Os
build_flags =
  ${tflm.flags}
  -DCODA_BOARD_NAME=\"pico2\"
  -DCODA_ARENA_BYTES=65536
  -DCODA_MODEL_CAPACITY=131072
